<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>데굴이가 골라줘</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&family=Outfit:wght@600;800;900&display=swap');
    :root {
      color-scheme: light;
      --ink: #18181b;
      --forest: #16804c;
      --cream: #ffffff;
      --paper: #ffe66a;
      --carrot: #f97316;
      --sun: #ffd83d;
      --setup-ink: #18181b;
      --setup-cream: #ffffff;
      --setup-orange: #f97316;
      --setup-orange-dark: #ea580c;
      --viewport-height: 100dvh;
      --safe-top: var(--toss-safe-area-top, env(safe-area-inset-top, 0px));
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: var(--toss-safe-area-bottom, env(safe-area-inset-bottom, 0px));
      --safe-left: env(safe-area-inset-left, 0px);
      --app-height: var(--viewport-height);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; background: #ffffff; }
    body { display: grid; place-items: start center; font-family: "Gowun Dodum", Pretendard, system-ui, sans-serif; background-color: #ffffff; }
    #root { width: 100%; height: var(--viewport-height); display: grid; place-items: center; padding: 0; overflow: hidden; }
    #root > div { width: 100%; height: 100%; display: grid; place-items: center; }
    #game { position: relative; width: min(100%, 430px); height: var(--app-height); overflow: hidden; border: 0; background: #ffffff; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15); isolation: isolate; }
    #game::after { display: none; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    
    #hud { position: absolute; inset: 10px 12px auto; z-index: 4; width: calc(100% - 24px); min-width: 0; display: grid; gap: 3px; padding: 9px 12px 8px; overflow: hidden; border: 3px solid var(--ink); border-radius: 12px; pointer-events: none; color: var(--ink); background: #ffffff; box-shadow: 4px 4px 0 var(--ink); font-weight: 800; transform: rotate(-.5deg); }
    .hud-topline { width: 100%; min-width: 0; min-height: 38px; display: grid; grid-template-columns: minmax(0, 1fr) 38px; align-items: center; gap: 8px; overflow: visible; }
    #race-question { width: 100%; min-width: 0; max-width: 100%; display: block; overflow: hidden; font-family: inherit; font-weight: 1000; line-height: 1.05; letter-spacing: -.08em; white-space: nowrap; text-overflow: ellipsis; }
    #progress-area { min-width: 0; display: grid; gap: 3px; width: 100%; }
    #progress-label { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; }
    #progress-label strong, .hud-bottomline strong { display: inline-flex; min-width: 46px; justify-content: center; padding: 4px 8px; border: 2px solid var(--ink); border-radius: 999px; color: #ffffff; background: var(--carrot); box-shadow: 2px 2px 0 var(--ink); font: 900 13px/1 'Outfit', Pretendard, system-ui, sans-serif; }
    #status { padding: 0; color: var(--ink); background: transparent; font-size: 11px; font-weight: 900; }
    #progress-track { height: 16px; overflow: hidden; border: 2px solid var(--ink); border-radius: 999px; background: #fff3c4; box-shadow: inset 2px 2px 0 rgb(24 24 27 / 15%); }
    #progress-track span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #facc15 0%, #fb923c 58%, var(--carrot) 100%); box-shadow: inset 0 -2px 0 rgb(255 255 255 / 35%); transition: width .2s ease; }
    .hud-bottomline { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    #race-timer { display: block; font: 900 21px/1 'Outfit', Pretendard, system-ui, sans-serif; font-variant-numeric: tabular-nums; letter-spacing: -.04em; text-align: left; }
    #live-rankings { position: absolute; top: 148px; right: 12px; z-index: 4; width: min(132px, 38%); padding: 6px 7px 7px; border: 2px solid var(--ink); border-radius: 10px; color: var(--ink); background: rgb(255 255 255 / 92%); box-shadow: 3px 3px 0 var(--ink); pointer-events: none; transform: rotate(.4deg); }
    #live-rankings > strong { display: block; margin-bottom: 4px; font-size: 10px; line-height: 1; text-align: right; }
    #live-rankings ol { display: grid; gap: 3px; margin: 0; padding: 0; list-style: none; }
    #live-rankings li { min-width: 0; display: grid; grid-template-columns: 18px minmax(0, 1fr); align-items: center; gap: 4px; font-size: 11px; font-weight: 900; line-height: 1.15; }
    #live-rankings li b { display: grid; width: 18px; height: 18px; place-items: center; border-radius: 50%; color: #fff; background: var(--carrot); font: 900 10px/1 'Outfit', sans-serif; }
    #live-rankings li span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
    #guide { position: absolute; z-index: 3; left: 50%; bottom: 36px; transform: translateX(-50%) rotate(-1deg); width: max-content; max-width: 88%; padding: 16px 28px; border: 3px solid var(--ink); border-radius: 12px; color: #ffffff; background: var(--carrot); box-shadow: 5px 5px 0 var(--ink); font: 800 16px/1.3 inherit; cursor: pointer; transition: all .15s ease; }
    #guide:active { transform: translateX(-50%) rotate(-1deg) translate(3px, 3px); box-shadow: 2px 2px 0 var(--ink); }
    #placement-guide { position: absolute; left: 50%; bottom: max(14px, calc(var(--safe-bottom) + 6px)); z-index: 3; display: grid; gap: 9px; width: min(92%, 360px); padding: 12px; border: 3px solid var(--ink); border-radius: 16px; background: #ffffff; box-shadow: 4px 4px 0 var(--ink); transform: translateX(-50%); text-align: center; pointer-events: auto; }
    #placement-guide span { font-size: 13px; font-weight: 900; }
    #placement-guide .primary { padding: 11px 14px; }
    #race-start { position: absolute; inset: 0; z-index: 8; display: grid; place-items: center; pointer-events: none; background: transparent; }
    .start-board { min-width: 230px; padding: 22px 26px 26px; border: 4px solid var(--ink); border-radius: 18px; color: #ffffff; background: #1671d9; box-shadow: 7px 7px 0 var(--ink); text-align: center; transform: rotate(-1deg); }
    .signal-lights { display: flex; justify-content: center; gap: 13px; margin-bottom: 10px; }
    .signal-lights i { width: 38px; height: 38px; border: 4px solid var(--ink); border-radius: 50%; background: #17372d; box-shadow: inset 0 -5px 0 rgb(0 0 0 / 25%); }
    .signal-lights i.on { background: #ffd83d; box-shadow: 0 0 24px #ffd83d, inset 0 -5px 0 #d78d13; }
    #start-count { color: #fffbd5; font: 900 78px/.95 'Outfit', Pretendard, system-ui, sans-serif; text-shadow: 0 6px 0 #10291f; }
    #start-caption { margin-top: 8px; color: #fff3a7; font-size: 14px; font-weight: 900; letter-spacing: .1em; }
    #race-start.is-go { background: transparent; }
    #race-start.is-go .start-board { min-width: 0; padding: 16px 28px 19px; border-color: #ffffff; border-radius: 999px; background: var(--carrot); box-shadow: 5px 5px 0 var(--ink); }
    #race-start.is-go .signal-lights, #race-start.is-go #start-caption { display: none; }
    #race-start.is-go #start-count { color: #ffffff; font-family: "Noto Sans KR", Pretendard, system-ui, sans-serif; font-size: 38px; font-weight: 700; line-height: 1; letter-spacing: .1em; white-space: nowrap; text-shadow: 0 2px 0 rgb(24 24 27 / 65%); }
    button, input, select { font: inherit; }
    button { touch-action: manipulation; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    .player-label { position: absolute; z-index: 3; transform: translate(-50%, -100%) scale(1); padding: 6px 12px; border: 2px solid var(--ink); border-radius: 8px; color: var(--ink); background: #fff3c9; font-family: "Noto Sans KR", Pretendard, system-ui, sans-serif; font-size: 13px; font-weight: 800; white-space: nowrap; box-shadow: 2px 2px 0 var(--ink); pointer-events: none; transition: transform 0.2s ease; }
    #error { position: absolute; inset: 0; z-index: 9; display: none; place-items: center; gap: 16px; padding: 28px; color: #fff; background: var(--ink); text-align: center; }
    #error.is-visible { display: grid; }
    [hidden] { display: none !important; }
    .overlay { position: absolute; inset: 0; z-index: 5; display: grid; align-items: end; padding: 82px 16px 18px; overflow: hidden; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); }
    
    .card { position: relative; width: 100%; padding: 26px 22px 22px; overflow: hidden; border: 3px solid var(--ink); border-radius: 20px; color: var(--ink); background: #ffffff; box-shadow: 6px 6px 0 var(--ink); transform: rotate(.15deg); }
    #result.overlay { padding-top: 24px; }
    #result .card { height: auto; max-height: calc(100% - 8px); padding: 16px 16px 14px; overflow: hidden; }
    .card > * { position: relative; z-index: 1; }
    .story-marquee { margin: -16px -16px 9px; overflow: hidden; border-bottom: 3px solid var(--ink); color: #fff; background: var(--carrot); font-size: 11px; font-weight: 800; letter-spacing: .08em; }
    .story-marquee-track { display: flex; width: max-content; padding: 8px 0; animation: story-marquee-scroll 12s linear infinite; will-change: transform; }
    .story-marquee-track span { width: max-content; padding-right: 24px; }
    @keyframes story-marquee-scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    .result-question { display: -webkit-box; margin: 0 0 9px; padding: 10px 12px; overflow: hidden; border: 2px solid var(--ink); border-radius: 8px; background: #fff7dc; font-size: 16px; font-weight: 800; line-height: 1.3; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .result-question span { margin-right: 5px; color: var(--carrot); font-weight: 900; }
    .hero-title, .card h2, .card > p, #result-speech, #result-copy, button { word-break: keep-all; overflow-wrap: break-word; }
    #result-title { white-space: pre-line; }
    #result .card:not(.replay-card) > #result-title { max-width: calc(100% - 28px); margin-left: 28px; font-size: 22px; }
    #result .card:not(.replay-card) > #result-title::before { content: 'A.'; margin-right: 8px; color: var(--carrot); }
    .card h2 { max-width: 19rem; margin: 0 0 8px; font-size: 26px; font-weight: 900; line-height: 1.1; letter-spacing: -.04em; }
    .primary { width: 100%; padding: 15px 14px; border: 3px solid var(--ink); border-radius: 12px; color: #fff; background: var(--carrot); box-shadow: 4px 4px 0 var(--ink); font-size: 16px; font-weight: 900; transition: transform 120ms ease, box-shadow 120ms ease; }
    .secondary { width: 100%; padding: 15px 14px; border: 3px solid var(--ink); border-radius: 12px; color: var(--ink); background: #f2dfa7; box-shadow: 3px 3px 0 var(--ink); font-size: 15px; font-weight: 800; transition: transform 120ms ease, box-shadow 120ms ease; }
    .primary:active:not(:disabled), .secondary:active { transform: translateY(3px); box-shadow: 1px 1px 0 var(--ink); }

    .feedback-carousel { display: block; margin: 5px 0 7px; border-block: 3px dashed var(--ink); }
    #result-copy { min-height: 38px; margin: 0; padding: 6px 8px; display: grid; place-items: center; color: #3f3f46; text-align: center; font-size: 13px; font-weight: 900; line-height: 1.25; overflow-wrap: anywhere; }
    .result-character { display: grid; place-items: center; margin: 3px 0; }
    #result-character-image { width: 112px; height: 112px; object-fit: contain; filter: drop-shadow(2px 3px 0 rgba(0,0,0,0.15)); }
    #result-list { margin: 6px 0 8px; padding: 0; list-style: none; display: grid; gap: 4px; }
    #result-list li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 6px; min-width: 0; padding: 4px 8px; border: 3px solid var(--ink); border-radius: 10px; background: #f2dfa7; box-shadow: 3px 3px 0 var(--ink); font-size: 13px; font-weight: 800; }
    #result-list li:nth-child(1) { background: var(--carrot); color: #fff; }
    #result-list li:nth-child(2) { background: #fde68a; }
    #result-list li:nth-child(3) { background: #bae6fd; }
    #result-list li:nth-child(4) { background: #c7d2fe; }
    .rank-character { display: grid; width: 32px; height: 32px; place-items: center; overflow: hidden; }
    .rank-character img { display: block; width: 32px; height: 32px; object-fit: contain; filter: drop-shadow(1px 2px 0 rgb(0 0 0 / 18%)); }
    .rank-character > span { font-size: 34px; line-height: 1; }
    .rank-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 42px; padding: 4px 7px; border: 2px solid currentColor; border-radius: 999px; font-weight: 950; white-space: nowrap; }
    .rank-name { min-width: 0; overflow-wrap: anywhere; word-break: keep-all; }
    .rank-character { white-space: nowrap; font-size: .9em; }
    .actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; position: relative; z-index: 1; }
    .actions button { width: 100%; padding: 11px 9px; }
    #result .replay-card { height: min(360px, calc(100% - 16px)); padding: 14px 16px 12px; overflow: hidden; color: #4a2b17; background: #fff1ce; border-color: #5b351f; box-shadow: 6px 6px 0 #5b351f; }
    #result .replay-card:has(.replay-pile[data-count="3"]) { height: min(380px, calc(100% - 16px)); }
    #result .replay-card:has(.replay-pile[data-count="4"]) { height: min(400px, calc(100% - 16px)); }
    .replay-confirm { width: 100%; height: 100%; min-width: 0; max-width: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; align-items: center; overflow: hidden; font-family: "Jua", "Noto Sans KR", sans-serif; text-align: center; }
    .replay-confirm h2 { max-width: none; margin: 0; color: #4a2b17; font-size: clamp(28px, 8vw, 36px); line-height: 1.02; text-shadow: 0 4px 0 #fff9e9, 3px 7px 0 rgb(74 43 23 / 18%); }
    .replay-pile { position: relative; align-self: stretch; width: 100%; min-width: 0; max-width: 100%; min-height: 0; margin: 2px auto 4px; pointer-events: none; }
    .pile-character { position: absolute; min-width: 0; width: 44%; max-width: 128px; aspect-ratio: 1; transform-origin: 50% 70%; filter: drop-shadow(4px 8px 3px rgb(74 43 23 / 22%)); }
    .pile-character img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .pile-sweat { position: absolute; top: 17%; right: 17%; font-size: 24px; filter: drop-shadow(1px 2px 0 #fff); }
    .replay-pile[data-count="2"] .pile-character { width: 48%; }
    .replay-pile[data-count="2"] .pile-character:nth-child(1) { left: 18%; top: 10%; transform: rotate(-27deg); z-index: 1; }
    .replay-pile[data-count="2"] .pile-character:nth-child(2) { right: 18%; top: 14%; transform: rotate(25deg); z-index: 2; }
    .replay-pile[data-count="3"] .pile-character { width: 43%; }
    .replay-pile[data-count="3"] .pile-character:nth-child(1) { left: 14%; top: 20%; transform: rotate(-36deg); z-index: 3; }
    .replay-pile[data-count="3"] .pile-character:nth-child(2) { left: 29%; top: 1%; transform: rotate(-5deg); z-index: 1; }
    .replay-pile[data-count="3"] .pile-character:nth-child(3) { right: 14%; top: 20%; transform: rotate(34deg); z-index: 2; }
    .replay-pile[data-count="4"] .pile-character { width: 39%; }
    .replay-pile[data-count="4"] .pile-character:nth-child(1) { left: 10%; top: 0; transform: rotate(-24deg); z-index: 1; }
    .replay-pile[data-count="4"] .pile-character:nth-child(2) { right: 10%; top: 2%; transform: rotate(23deg); z-index: 2; }
    .replay-pile[data-count="4"] .pile-character:nth-child(3) { left: 20%; bottom: -7%; transform: rotate(-42deg); z-index: 4; }
    .replay-pile[data-count="4"] .pile-character:nth-child(4) { right: 20%; bottom: -7%; transform: rotate(40deg); z-index: 5; }
    .replay-pile.is-crying { display: flex; align-items: flex-end; justify-content: center; gap: 0; padding: 0 5% 2%; overflow: hidden; }
    .replay-pile.is-crying .pile-character { position: relative; inset: auto !important; width: 38% !important; height: auto; max-width: 128px; margin: 0 -4%; transform: none !important; }
    .replay-pile.is-crying[data-count="3"] .pile-character { width: 34% !important; margin-inline: -3.5%; }
    .replay-pile.is-crying[data-count="4"] .pile-character { width: 30% !important; margin-inline: -3%; }
    .replay-actions { width: 100%; min-width: 0; display: grid; gap: 7px; padding: 0 8px 4px; }
    .replay-actions .primary { border-radius: 999px; padding-block: 11px; font-size: 16px; }
    .replay-actions .secondary { width: 72%; justify-self: center; padding-block: 9px; border-radius: 999px; background: #fff4d6; }
    #result .replay-card .primary { color: #fff; background: var(--carrot); border-color: #5b351f; box-shadow: 4px 4px 0 #5b351f; }
    #result .replay-card .secondary { color: #4a2b17; background: #fff4d6; border-color: #5b351f; box-shadow: 3px 3px 0 #5b351f; }
    #result .replay-actions .primary:active, #result .replay-actions .secondary:active { transform: none; }
    #result .replay-actions .primary:active { box-shadow: 4px 4px 0 #5b351f; }
    #result .replay-actions .secondary:active { box-shadow: 3px 3px 0 #5b351f; }

    #setup {
      display: block;
      padding: 0;
      overflow: hidden;
      color: var(--setup-ink);
      background: var(--setup-cream);
    }
    #setup .setup-page {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 18px 24px;
      overflow: hidden;
      font-family: "Noto Sans KR", Pretendard, system-ui, sans-serif;
      background: var(--setup-cream);
    }
    #setup .setup-page::before,
    #setup .setup-page::after {
      position: absolute;
      z-index: 0;
      width: 58px;
      height: 58px;
      border: 3px solid var(--setup-ink);
      pointer-events: none;
      content: "";
    }
    #setup .setup-page::before { top: 80px; left: -31px; border-radius: 50%; background: #facc15; transform: rotate(24deg); }
    #setup .setup-page::after { right: -25px; bottom: 98px; background: #7dd3fc; transform: rotate(36deg); }
    #setup .setup-page > * { position: relative; z-index: 1; }
    #setup .setup-topbar { position: absolute; inset: 0 0 auto; z-index: 2; height: 10px; background: repeating-linear-gradient(90deg, var(--setup-orange) 0 27px, #facc15 27px 54px, #fb7185 54px 81px, #818cf8 81px 108px); }
    #setup .setup-card,
    #setup #decision-question,
    #setup #setup-submit { border: 3px solid var(--setup-ink); box-shadow: 4px 4px 0 var(--setup-ink); }
    #setup .setup-header { margin: 8px auto 14px; text-align: center; }
    #setup .brand-pill { display: inline-block; padding: 8px 18px; border: 2px solid var(--setup-ink); border-radius: 999px; background: #facc15; box-shadow: 2px 3px 0 var(--setup-ink); font-size: 14px; font-weight: 900; letter-spacing: .08em; transform: rotate(-2deg); }
    #setup #setup-title { margin: 12px 0 10px; font-size: clamp(30px, 8vw, 40px); font-weight: 950; line-height: 1.28; letter-spacing: -.05em; word-break: keep-all; }
    #setup #setup-title em { display: inline-block; font-style: normal; color: var(--setup-orange); transform: translateY(-5px) rotate(-5deg); margin: 0 4px; text-decoration: underline 4px #facc15; text-underline-offset: 6px; }
    #setup #setup-description { margin: 0; color: #52525b; font-size: 13px; font-weight: 650; line-height: 1.5; white-space: nowrap; }
    #setup .question-field { position: relative; margin: 0 0 14px; padding-top: 10px; }
    #setup .question-field label { position: absolute; top: 0; left: 14px; z-index: 1; padding: 2px 8px; color: var(--setup-ink); background: #facc15; font-size: 12px; font-weight: 900; transform: rotate(-2deg); border: 2px solid var(--setup-ink); }
    #setup #decision-question { display: none; width: 100%; padding: 17px 15px 13px; border-radius: 9px; color: var(--setup-ink); background: #fff; font-size: 16px; font-weight: 700; }
    #game[data-mode="choice"] #setup #decision-question { display: block; }
    #setup #decision-question::placeholder { color: #a1a1aa; }
    #setup #name-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; overflow: visible; }
    #game[data-mode="choice"] #setup #name-fields { border: 0; border-radius: 0; background: transparent; box-shadow: none; }
    #setup .participant { position: relative; min-width: 0; display: grid; grid-template-rows: auto 1fr; padding: 0; border-radius: 10px; overflow: hidden; box-shadow: 4px 4px 0 var(--setup-ink); }
    #setup .setup-card--yellow { background: #fde68a; }
    #setup .setup-card--rose { background: #fecdd3; }
    #setup .setup-card--indigo { background: #c7d2fe; }
    #setup .setup-card--sky { background: #bae6fd; }
    #setup #name-fields input,
    #setup #name-fields select { min-width: 0; width: 100%; color: var(--setup-ink); outline: none; }
    #setup #name-fields input { padding: 9px 8px 7px; border: 0; border-bottom: 3px solid var(--setup-ink); background: rgb(255 255 255 / 68%); font-size: 14px; font-weight: 800; text-align: center; }
    #setup #name-fields select { display: none; }
    #setup .mini-character-picker { position: relative; min-height: 104px; display: flex; align-items: center; justify-content: space-between; padding: 4px; background: rgb(255 255 255 / 34%); }
    #setup .mini-character-preview { position: absolute; top: 3px; left: 50%; width: 96px; height: 92px; display: grid; place-items: center; grid-template-rows: 64px 20px; row-gap: 5px; transform: translateX(-50%); font-size: 12px; font-weight: 800; touch-action: pan-y; cursor: grab; }
    #setup .mini-character-preview img { width: 96px; max-width: none; height: 64px; object-fit: contain; filter: drop-shadow(2px 3px 0 rgb(24 24 27 / 24%)); }
    #setup .mini-character-preview span { position: relative; z-index: 2; width: max-content; max-width: 120px; padding: 4px 10px; border: 2px solid var(--setup-ink); border-radius: 999px; background: #ffffff; font-size: 12px; font-weight: 800; line-height: 1.2; white-space: nowrap; color: #18181b; box-shadow: 2px 2px 0 var(--setup-ink); }
    #setup .character-step { position: relative; top: -4px; z-index: 3; width: 40px; height: 40px; padding: 0; border: 0; color: var(--setup-ink); background: transparent !important; box-shadow: none !important; font-family: Arial, sans-serif; font-size: 36px; font-weight: 700; line-height: 1; display: inline-flex; align-items: center; justify-content: center; opacity: 0.8; transition: transform 0.15s ease, opacity 0.15s ease; }
    #setup .character-step:hover:not(:disabled) { opacity: 1; transform: scale(1.2); }
    #setup .character-step:active:not(:disabled) { transform: scale(0.9); }
    #setup .character-step:disabled { opacity: 0.25; cursor: not-allowed; }

    /* Hamburger Menu Button & Modal */
    #menu-btn {

      height: 38px;
