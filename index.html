<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>데굴이가 골라줘</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&family=Outfit:wght@600;800;900&display=swap');
    :root {
      color-scheme: light;
      --ink: #18181b;
      --forest: #16804c;
      --cream: #ffffff;
      --paper: #ffe66a;
      --carrot: #f97316;
      --sun: #ffd83d;
      --setup-ink: #18181b;
      --setup-cream: #ffffff;
      --setup-orange: #f97316;
      --setup-orange-dark: #ea580c;
      --app-height: 100dvh;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #ffffff; }
    body { display: grid; place-items: center; font-family: "Gowun Dodum", Pretendard, system-ui, sans-serif; background-color: #ffffff; }
    #root, #root > div { width: 100%; height: 100%; display: grid; place-items: center; }
    #game { position: relative; width: min(100vw, 430px); height: var(--app-height); max-height: 900px; overflow: hidden; border: 0; background: #ffffff; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15); isolation: isolate; }
    #game::after { display: none; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    
    #hud { position: absolute; inset: max(14px, env(safe-area-inset-top)) 14px auto; z-index: 4; display: grid; gap: 5px; padding: 13px 16px 12px; border: 3px solid var(--ink); border-radius: 12px; pointer-events: none; color: var(--ink); background: #ffffff; box-shadow: 4px 4px 0 var(--ink); font-weight: 800; transform: rotate(-.5deg); }
    .hud-topline { position: relative; display: block; min-height: 36px; padding-right: 54px; }
    #race-question { min-width: 0; display: block; overflow: hidden; font-family: inherit; font-weight: 1000; line-height: 1.05; letter-spacing: -.08em; white-space: nowrap; text-overflow: clip; }
    #progress-area { display: grid; gap: 5px; width: 100%; }
    #progress-label { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; }
    #progress-label strong, .hud-bottomline strong { display: inline-flex; min-width: 52px; justify-content: center; padding: 5px 9px; border: 2px solid var(--ink); border-radius: 999px; color: #ffffff; background: var(--carrot); box-shadow: 2px 2px 0 var(--ink); font: 900 14px/1 'Outfit', Pretendard, system-ui, sans-serif; }
    #status { padding: 0; color: var(--ink); background: transparent; font-size: 12px; font-weight: 900; }
    #progress-track { height: 22px; overflow: hidden; border: 3px solid var(--ink); border-radius: 999px; background: #fff3c4; box-shadow: inset 2px 2px 0 rgb(24 24 27 / 15%); }
    #progress-track span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #facc15 0%, #fb923c 58%, var(--carrot) 100%); box-shadow: inset 0 -2px 0 rgb(255 255 255 / 35%); transition: width .2s ease; }
    .hud-bottomline { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    #race-timer { display: block; font: 900 25px/1 'Outfit', Pretendard, system-ui, sans-serif; font-variant-numeric: tabular-nums; letter-spacing: -.04em; text-align: left; }
    #guide { position: absolute; z-index: 3; left: 50%; bottom: max(36px, calc(env(safe-area-inset-bottom) + 20px)); transform: translateX(-50%) rotate(-1deg); width: max-content; max-width: 88%; padding: 16px 28px; border: 3px solid var(--ink); border-radius: 12px; color: #ffffff; background: var(--carrot); box-shadow: 5px 5px 0 var(--ink); font: 800 16px/1.3 inherit; cursor: pointer; transition: all .15s ease; }
    #guide:active { transform: translateX(-50%) rotate(-1deg) translate(3px, 3px); box-shadow: 2px 2px 0 var(--ink); }
    #placement-guide { position: absolute; left: 50%; bottom: max(24px, calc(env(safe-area-inset-bottom) + 16px)); z-index: 3; display: grid; gap: 9px; width: min(92%, 360px); padding: 12px; border: 3px solid var(--ink); border-radius: 16px; background: #ffffff; box-shadow: 4px 4px 0 var(--ink); transform: translateX(-50%); text-align: center; pointer-events: auto; }
    #placement-guide span { font-size: 13px; font-weight: 900; }
    #placement-guide .primary { padding: 11px 14px; }
    #race-start { position: absolute; inset: 0; z-index: 8; display: grid; place-items: center; pointer-events: none; background: transparent; }
    .start-board { min-width: 230px; padding: 22px 26px 26px; border: 4px solid var(--ink); border-radius: 18px; color: #ffffff; background: #1671d9; box-shadow: 7px 7px 0 var(--ink); text-align: center; transform: rotate(-1deg); }
    .signal-lights { display: flex; justify-content: center; gap: 13px; margin-bottom: 10px; }
    .signal-lights i { width: 38px; height: 38px; border: 4px solid var(--ink); border-radius: 50%; background: #17372d; box-shadow: inset 0 -5px 0 rgb(0 0 0 / 25%); }
    .signal-lights i.on { background: #ffd83d; box-shadow: 0 0 24px #ffd83d, inset 0 -5px 0 #d78d13; }
    #start-count { color: #fffbd5; font: 900 78px/.95 'Outfit', Pretendard, system-ui, sans-serif; text-shadow: 0 6px 0 #10291f; }
    #start-caption { margin-top: 8px; color: #fff3a7; font-size: 14px; font-weight: 900; letter-spacing: .1em; }
    #race-start.is-go { background: transparent; }
    #race-start.is-go .start-board { min-width: 0; padding: 16px 28px 19px; border-color: #ffffff; border-radius: 999px; background: var(--carrot); box-shadow: 5px 5px 0 var(--ink); }
    #race-start.is-go .signal-lights, #race-start.is-go #start-caption { display: none; }
    #race-start.is-go #start-count { color: #ffffff; font-family: "Noto Sans KR", Pretendard, system-ui, sans-serif; font-size: 38px; font-weight: 700; line-height: 1; letter-spacing: .1em; white-space: nowrap; text-shadow: 0 2px 0 rgb(24 24 27 / 65%); }
    button, input, select { font: inherit; }
    button { touch-action: manipulation; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    .player-label { position: absolute; z-index: 3; transform: translate(-50%, -100%) scale(1); padding: 6px 12px; border: 2px solid var(--ink); border-radius: 8px; color: var(--ink); background: #fff3c9; font-family: "Noto Sans KR", Pretendard, system-ui, sans-serif; font-size: 13px; font-weight: 800; white-space: nowrap; box-shadow: 2px 2px 0 var(--ink); pointer-events: none; transition: transform 0.2s ease; }
    #error { position: absolute; inset: 0; z-index: 6; display: none; place-items: center; padding: 28px; color: #fff; background: var(--ink); text-align: center; }
    [hidden] { display: none !important; }
    .overlay { position: absolute; inset: 0; z-index: 5; display: grid; align-items: end; padding: 82px 16px max(18px, env(safe-area-inset-bottom)); overflow: hidden; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); }
    
    .card { position: relative; width: 100%; padding: 26px 22px 22px; overflow: hidden; border: 3px solid var(--ink); border-radius: 20px; color: var(--ink); background: #ffffff; box-shadow: 6px 6px 0 var(--ink); transform: rotate(.15deg); }
    #result .card { max-height: calc(var(--app-height) - 34px); overflow-y: auto; }
    .card > * { position: relative; z-index: 1; }
    .story-marquee { margin: -26px -22px 18px; overflow: hidden; border-bottom: 3px solid var(--ink); color: #fff; background: var(--carrot); font-size: 12px; font-weight: 800; letter-spacing: .08em; }
    .story-marquee-track { display: flex; width: max-content; padding: 8px 0; animation: story-marquee-scroll 12s linear infinite; will-change: transform; }
    .story-marquee-track span { width: max-content; padding-right: 24px; }
    @keyframes story-marquee-scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    .hero-title, .card h2, .card > p, #result-speech, #result-copy, button { word-break: keep-all; overflow-wrap: break-word; }
    #result-title { white-space: pre-line; }
    .card h2 { max-width: 19rem; margin: 0 0 8px; font-size: 26px; font-weight: 900; line-height: 1.1; letter-spacing: -.04em; }
    .primary { width: 100%; padding: 15px 14px; border: 3px solid var(--ink); border-radius: 12px; color: #fff; background: var(--carrot); box-shadow: 4px 4px 0 var(--ink); font-size: 16px; font-weight: 900; transition: transform 120ms ease, box-shadow 120ms ease; }
    .secondary { width: 100%; padding: 15px 14px; border: 3px solid var(--ink); border-radius: 12px; color: var(--ink); background: #f2dfa7; box-shadow: 3px 3px 0 var(--ink); font-size: 15px; font-weight: 800; transition: transform 120ms ease, box-shadow 120ms ease; }
    .primary:active:not(:disabled), .secondary:active { transform: translateY(3px); box-shadow: 1px 1px 0 var(--ink); }

    .feedback-carousel { display: block; margin: 16px 0 20px; border-block: 3px dashed var(--ink); }
    #result-copy { min-height: 54px; margin: 0; padding: 13px 10px; display: grid; place-items: center; color: #3f3f46; text-align: center; font-size: 15px; font-weight: 900; line-height: 1.35; overflow-wrap: anywhere; }
    .result-character { display: grid; place-items: center; margin: 14px 0; }
    #result-character-image { width: 104px; height: 104px; object-fit: contain; filter: drop-shadow(2px 3px 0 rgba(0,0,0,0.15)); }
    #result-list { margin: 14px 0 26px; padding: 0; list-style: none; display: grid; gap: 8px; }
    #result-list li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 8px; min-width: 0; padding: 11px 13px; border: 3px solid var(--ink); border-radius: 10px; background: #f2dfa7; box-shadow: 3px 3px 0 var(--ink); font-weight: 800; }
    #result-list li:nth-child(1) { background: var(--carrot); color: #fff; }
    #result-list li:nth-child(2) { background: #fde68a; }
    #result-list li:nth-child(3) { background: #bae6fd; }
    #result-list li:nth-child(4) { background: #c7d2fe; }
    .rank-character { display: grid; width: 54px; height: 54px; place-items: center; overflow: hidden; }
    .rank-character img { display: block; width: 54px; height: 54px; object-fit: contain; filter: drop-shadow(1px 2px 0 rgb(0 0 0 / 18%)); }
    .rank-character > span { font-size: 34px; line-height: 1; }
    .rank-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 42px; padding: 4px 7px; border: 2px solid currentColor; border-radius: 999px; font-weight: 950; white-space: nowrap; }
    .rank-name { min-width: 0; overflow-wrap: anywhere; word-break: keep-all; }
    .rank-character { white-space: nowrap; font-size: .9em; }
    .actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; position: relative; z-index: 1; }
    .actions button { width: 100%; }

    #setup {
      display: block;
      padding: 0;
      overflow-x: hidden;
      overflow-y: auto;
      color: var(--setup-ink);
      background: var(--setup-cream);
    }
    #setup .setup-page {
      position: relative;
      width: 100%;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      padding: max(18px, env(safe-area-inset-top)) 24px max(18px, env(safe-area-inset-bottom));
      overflow: hidden;
      font-family: "Noto Sans KR", Pretendard, system-ui, sans-serif;
      background: var(--setup-cream);
    }
    #setup .setup-page::before,
    #setup .setup-page::after {
      position: absolute;
      z-index: 0;
      width: 58px;
      height: 58px;
      border: 3px solid var(--setup-ink);
      pointer-events: none;
      content: "";
    }
    #setup .setup-page::before { top: 80px; left: -31px; border-radius: 50%; background: #facc15; transform: rotate(24deg); }
    #setup .setup-page::after { right: -25px; bottom: 98px; background: #7dd3fc; transform: rotate(36deg); }
    #setup .setup-page > * { position: relative; z-index: 1; }
    #setup .setup-topbar { position: absolute; inset: 0 0 auto; z-index: 2; height: 10px; background: repeating-linear-gradient(90deg, var(--setup-orange) 0 27px, #facc15 27px 54px, #fb7185 54px 81px, #818cf8 81px 108px); }
    #setup .setup-card,
    #setup #decision-question,
    #setup #setup-submit { border: 3px solid var(--setup-ink); box-shadow: 4px 4px 0 var(--setup-ink); }
    #setup .setup-header { margin: 8px auto 14px; text-align: center; }
    #setup .brand-pill { display: inline-block; padding: 8px 18px; border: 2px solid var(--setup-ink); border-radius: 999px; background: #facc15; box-shadow: 2px 3px 0 var(--setup-ink); font-size: 14px; font-weight: 900; letter-spacing: .08em; transform: rotate(-2deg); }
    #setup #setup-title { margin: 12px 0 10px; font-size: clamp(30px, 8vw, 40px); font-weight: 950; line-height: 1.28; letter-spacing: -.05em; word-break: keep-all; }
    #setup #setup-title em { display: inline-block; font-style: normal; color: var(--setup-orange); transform: translateY(-5px) rotate(-5deg); margin: 0 4px; text-decoration: underline 4px #facc15; text-underline-offset: 6px; }
    #setup #setup-description { margin: 0; color: #52525b; font-size: 13px; font-weight: 650; line-height: 1.5; white-space: nowrap; }
    #setup .question-field { position: relative; margin: 0 0 14px; padding-top: 10px; }
    #setup .question-field label { position: absolute; top: 0; left: 14px; z-index: 1; padding: 2px 8px; color: var(--setup-ink); background: #facc15; font-size: 12px; font-weight: 900; transform: rotate(-2deg); border: 2px solid var(--setup-ink); }
    #setup #decision-question { display: none; width: 100%; padding: 17px 15px 13px; border-radius: 9px; color: var(--setup-ink); background: #fff; font-size: 16px; font-weight: 700; }
    #game[data-mode="choice"] #setup #decision-question { display: block; }
    #setup #decision-question::placeholder { color: #a1a1aa; }
    #setup #name-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; overflow: visible; }
    #game[data-mode="choice"] #setup #name-fields { border: 0; border-radius: 0; background: transparent; box-shadow: none; }
    #setup .participant { position: relative; min-width: 0; display: grid; grid-template-rows: auto 1fr; padding: 0; border-radius: 10px; overflow: hidden; box-shadow: 4px 4px 0 var(--setup-ink); }
    #setup .setup-card--yellow { background: #fde68a; }
    #setup .setup-card--rose { background: #fecdd3; }
    #setup .setup-card--indigo { background: #c7d2fe; }
    #setup .setup-card--sky { background: #bae6fd; }
    #setup #name-fields input,
    #setup #name-fields select { min-width: 0; width: 100%; color: var(--setup-ink); outline: none; }
    #setup #name-fields input { padding: 11px 8px 8px; border: 0; border-bottom: 3px solid var(--setup-ink); background: rgb(255 255 255 / 68%); font-size: 14px; font-weight: 800; text-align: center; }
    #setup #name-fields select { display: none; }
    #setup .mini-character-picker { position: relative; min-height: 132px; display: flex; align-items: center; justify-content: space-between; padding: 4px; background: rgb(255 255 255 / 34%); }
    #setup .mini-character-preview { position: absolute; top: 3px; left: 50%; width: 112px; height: 118px; display: grid; place-items: center; grid-template-rows: 88px 22px; row-gap: 6px; transform: translateX(-50%); font-size: 12px; font-weight: 800; touch-action: pan-y; cursor: grab; }
    #setup .mini-character-preview img { width: 112px; max-width: none; height: 88px; object-fit: contain; filter: drop-shadow(2px 3px 0 rgb(24 24 27 / 24%)); }
    #setup .mini-character-preview span { position: relative; z-index: 2; width: max-content; max-width: 120px; padding: 4px 10px; border: 2px solid var(--setup-ink); border-radius: 999px; background: #ffffff; font-size: 12px; font-weight: 800; line-height: 1.2; white-space: nowrap; color: #18181b; box-shadow: 2px 2px 0 var(--setup-ink); }
    #setup .character-step { position: relative; top: -4px; z-index: 3; width: 36px; height: 36px; padding: 0; border: 0; color: var(--setup-ink); background: transparent !important; box-shadow: none !important; font-family: Arial, sans-serif; font-size: 32px; font-weight: 700; line-height: 1; display: inline-flex; align-items: center; justify-content: center; opacity: 0.8; transition: transform 0.15s ease, opacity 0.15s ease; }
    #setup .character-step:hover:not(:disabled) { opacity: 1; transform: scale(1.2); }
    #setup .character-step:active:not(:disabled) { transform: scale(0.9); }
    #setup .character-step:disabled { opacity: 0.25; cursor: not-allowed; }
    #setup .participant.is-disabled { opacity: 0.42; filter: grayscale(85%); box-shadow: 2px 2px 0 var(--setup-ink); border-style: dashed; transition: opacity 0.25s ease, filter 0.25s ease; }
    #setup .participant.is-disabled:hover, #setup .participant.is-disabled:focus-within { opacity: 0.95; filter: grayscale(0%); border-style: solid; }
    #setup #name-fields select option:disabled { color: #a1a1aa; }
    #setup #name-fields input:focus { box-shadow: inset 0 -4px 0 var(--setup-orange); }
    #setup .settings { display: flex; justify-content: center; gap: 18px; margin: 8px 0 4px; color: var(--setup-ink); font-size: 14px; font-weight: 800; }
    #setup .settings label { min-height: 44px; display: inline-flex; align-items: center; gap: 7px; cursor: pointer; }
    #setup .settings input { appearance: none; -webkit-appearance: none; width: 22px; height: 22px; margin: 0; border: 2.5px solid var(--setup-ink); border-radius: 6px; background: #ffffff; box-shadow: 2px 2px 0 var(--setup-ink); cursor: pointer; display: inline-grid; place-content: center; transition: all 0.15s ease; }
    #setup .settings input:checked { background: var(--setup-orange) !important; border-color: var(--setup-ink) !important; box-shadow: 2px 2px 0 var(--setup-ink) !important; }
    #setup .settings input:checked::after { content: "✓"; color: #ffffff; font-size: 14px; font-weight: 900; line-height: 1; }
    #setup .settings select { padding: 4px 8px; border: 2px solid var(--setup-ink); border-radius: 8px; color: var(--setup-ink); background: #fff; font-weight: 800; box-shadow: 2px 2px 0 var(--setup-ink); }
    #setup .setup-footer { margin-top: auto; padding-top: 0; text-align: center; }
    #setup #setup-submit { width: 100%; padding: 15px 12px; border-radius: 999px; color: #fff; background: var(--setup-orange); font-size: 16px; font-weight: 900; }
    #setup #setup-submit:not(:disabled):hover { background: var(--setup-orange-dark); }
    #setup #setup-submit:hover { color: #ffffff; }
    #setup #setup-submit.is-incomplete { color: #71717a; background: #e4e4e7; }
    #setup #setup-submit.is-incomplete:hover { color: #ffffff; }
    #setup .mini-character-art { width: 112px; height: 88px; display: block; object-fit: contain; filter: drop-shadow(2px 3px 0 rgb(24 24 27 / 24%)); }
    #setup .mini-character-art.is-loading { background: transparent; filter: none; }
    #setup :focus-visible { outline: 4px solid rgb(250 204 21 / 45%); outline-offset: 2px; }

    /* Clean High-Contrast Night Mode (밤 테마) */
    #game[data-theme="night"] {
      --setup-ink: #f8fafc;
      --setup-cream: #0f172a;
      --ink: #f8fafc;
    }
    #game[data-theme="night"] { background-color: #0f172a; }
    #game[data-theme="night"] #setup, #game[data-theme="night"] .setup-page {
      background-color: #0f172a;
      color: #f8fafc;
    }
    #game[data-theme="night"] #setup #setup-title { color: #f8fafc; }
    #game[data-theme="night"] #setup #setup-title em { color: #ff785a; text-decoration: underline 4px #facc15; text-underline-offset: 6px; }
    #game[data-theme="night"] #setup #setup-description { color: #94a3b8; }
    #game[data-theme="night"] #setup .brand-pill { background: #312e81; color: #a5b4fc; border-color: #818cf8; box-shadow: 2px 3px 0 #000; }
    #game[data-theme="night"] #setup .question-field label { color: #fef08a; background: #854d0e; border-color: #facc15; }
    #game[data-theme="night"] #setup #decision-question { background: #1e293b; border-color: #475569; color: #f8fafc; box-shadow: 4px 4px 0 #000; }
    #game[data-theme="night"] #setup #decision-question::placeholder { color: #cbd5e1; }
    #game[data-theme="night"] #setup .participant { background: #1e293b; border-color: #475569; box-shadow: 4px 4px 0 #000; }
    #game[data-theme="night"] #setup .participant.is-disabled { opacity: 0.58; filter: grayscale(90%); box-shadow: 2px 2px 0 #000; }
    #game[data-theme="night"] #setup .setup-card--yellow { background: linear-gradient(180deg, #2d261e 0%, #1e1b18 100%); }
    #game[data-theme="night"] #setup .setup-card--rose { background: linear-gradient(180deg, #2e1d24 0%, #1e1519 100%); }
    #game[data-theme="night"] #setup .setup-card--indigo { background: linear-gradient(180deg, #1e2338 0%, #151828 100%); }
    #game[data-theme="night"] #setup .setup-card--sky { background: linear-gradient(180deg, #192738 0%, #121c28 100%); }
    #game[data-theme="night"] #setup #name-fields input { background: rgba(15, 23, 42, 0.8); color: #f8fafc; border-bottom-color: #475569; }
    #game[data-theme="night"] #setup #name-fields input::placeholder { color: #cbd5e1; }
    #game[data-theme="night"] #setup .mini-character-picker { background: rgb(15 23 42 / 45%); }
    #game[data-theme="night"] #setup .mini-character-preview span { background: #1e293b; color: #f8fafc !important; border-color: #64748b; box-shadow: 2px 2px 0 #000; }
    #game[data-theme="night"] #setup .character-step { color: #f8fafc; background: transparent !important; opacity: 0.85; }
    #game[data-theme="night"] #setup .character-step:hover:not(:disabled) { opacity: 1; color: #ffffff; }
    #game[data-theme="night"] #setup .settings { color: #f8fafc; }
    #game[data-theme="night"] #setup .settings select { color: #f8fafc; background: #1e293b; border-color: #475569; box-shadow: 2px 2px 0 #000; }
    #game[data-theme="night"] #setup .settings input { background: #1e293b; border-color: #64748b; box-shadow: 2px 2px 0 #000; }
    #game[data-theme="night"] #setup .settings input:checked { background: #f97316 !important; border-color: #f8fafc !important; box-shadow: 2px 2px 0 #000 !important; }
    #game[data-theme="night"] #setup .settings input:checked::after { color: #ffffff; font-size: 14px; font-weight: 900; }
    #game[data-theme="night"] #setup #setup-submit,
    #game[data-theme="night"] #setup #setup-submit.is-incomplete,
    #game[data-theme="night"] #setup #setup-submit:hover { color: #ffffff; background: #7e22ce; border-color: #a855f7; box-shadow: 4px 4px 0 #000; }
    #game[data-theme="night"] .start-board { border-color: #a855f7; background: #312e81; box-shadow: 7px 7px 0 #000; }
    #game[data-theme="night"] #race-start.is-go .start-board { border-color: #a855f7; background: #7e22ce; box-shadow: 5px 5px 0 #000; }
    #game[data-theme="night"] #hud { background: #1e293b; border-color: #475569; color: #f8fafc; box-shadow: 4px 4px 0 #000; }

    /* Hamburger Menu Button & Modal */
    #menu-btn {
      position: absolute;
      top: 0;
      right: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 3px solid var(--ink);
      border-radius: 50%;
      color: var(--ink);
      background: #ffffff;
      box-shadow: 3px 3px 0 var(--ink);
      pointer-events: auto;
      transition: all 0.2s ease;
    }
    #menu-btn:hover { color: #ffffff; background: var(--carrot); transform: scale(1.06); }
    #menu-btn:active { transform: translate(2px, 2px) scale(.98); box-shadow: 1px 1px 0 var(--ink); }
    #game[data-theme="night"] #menu-btn { color: #f8fafc; background: #1e293b; border-color: #f8fafc; box-shadow: 3px 3px 0 #000; }
    #game[data-theme="night"] #menu-btn:hover { color: #ffffff; background: #7e22ce; }

    .menu-card { text-align: center; padding: 32px 24px 28px; }
    .menu-card h2 { font-size: 26px; margin: 0 0 8px; color: #0f172a; }
    .menu-card p { margin: 0 0 24px; color: #64748b; font-size: 15px; font-weight: 600; line-height: 1.5; }
    .menu-actions { display: flex; flex-direction: column; gap: 10px; }

    @media (max-height: 800px) {
      #setup .setup-page { padding: 12px 20px max(10px, env(safe-area-inset-bottom)); }

      #setup .mini-character-picker { min-height: 116px; }
      #setup .mini-character-preview { height: 108px; grid-template-rows: 78px 22px; }
      #setup .mini-character-preview img,

    @media (hover: hover) { button:hover { filter: brightness(1.08); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
