<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>데굴이가 골라줘</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&family=Outfit:wght@600;800;900&display=swap');
    :root {
      color-scheme: light;
      --ink: #18181b;
      --forest: #16804c;
      --cream: #ffffff;
      --paper: #ffe66a;
      --carrot: #f97316;
      --sun: #ffd83d;
      --setup-ink: #18181b;
      --setup-cream: #ffffff;
      --setup-orange: #f97316;
      --setup-orange-dark: #ea580c;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #ffffff; }
    body { display: grid; place-items: center; font-family: "Gowun Dodum", Pretendard, system-ui, sans-serif; background-color: #ffffff; }
    #game { position: relative; width: min(100vw, 430px); height: 100dvh; max-height: 900px; overflow: hidden; border: 0; background: #ffffff; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15); isolation: isolate; }
    #game::after { display: none; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    
    #hud { position: absolute; inset: max(14px, env(safe-area-inset-top)) 14px auto; z-index: 4; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 12px; padding: 12px 16px; border: 3px solid var(--ink); border-radius: 12px; pointer-events: none; color: var(--ink); background: #ffffff; box-shadow: 4px 4px 0 var(--ink); backdrop-filter: none; font-weight: 800; transform: rotate(-.5deg); }
    #race-question { min-width: 0; font-family: inherit; font-size: 15px; font-weight: 800; line-height: 1.25; letter-spacing: 0; word-break: keep-all; overflow-wrap: anywhere; }
    #status { padding: 5px 12px; border: 2px solid var(--ink); border-radius: 999px; color: #fff; background: var(--carrot); font-size: 12px; font-weight: 800; transform: rotate(3deg); box-shadow: 2px 2px 0 var(--ink); }
    #race-timer { grid-column: 1 / -1; font: 900 24px/1 'Outfit', Pretendard, system-ui, sans-serif; font-variant-numeric: tabular-nums; letter-spacing: -.04em; text-align: right; }
    #guide { position: absolute; z-index: 3; left: 50%; bottom: max(36px, calc(env(safe-area-inset-bottom) + 20px)); transform: translateX(-50%) rotate(-1deg); width: max-content; max-width: 88%; padding: 16px 28px; border: 3px solid var(--ink); border-radius: 12px; color: #ffffff; background: var(--carrot); box-shadow: 5px 5px 0 var(--ink); font: 800 16px/1.3 inherit; cursor: pointer; transition: all .15s ease; }
    #guide:active { transform: translateX(-50%) rotate(-1deg) translate(3px, 3px); box-shadow: 2px 2px 0 var(--ink); }
    button, input, select { font: inherit; }
    button { touch-action: manipulation; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    .player-label { position: absolute; z-index: 3; transform: translate(-50%, -100%) scale(1); padding: 6px 12px; border: 2px solid var(--ink); border-radius: 8px; color: var(--ink); background: #fff3c9; font-family: "Noto Sans KR", Pretendard, system-ui, sans-serif; font-size: 13px; font-weight: 800; white-space: nowrap; box-shadow: 2px 2px 0 var(--ink); pointer-events: none; transition: transform 0.2s ease; }
    #error { position: absolute; inset: 0; z-index: 6; display: none; place-items: center; padding: 28px; color: #fff; background: var(--ink); text-align: center; }
    [hidden] { display: none !important; }
    .overlay { position: absolute; inset: 0; z-index: 5; display: grid; align-items: end; padding: 82px 16px max(18px, env(safe-area-inset-bottom)); overflow: hidden; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); }
    
    .card { position: relative; width: 100%; padding: 26px 22px 22px; overflow: hidden; border: 3px solid var(--ink); border-radius: 20px; color: var(--ink); background: #ffffff; box-shadow: 6px 6px 0 var(--ink); transform: rotate(.15deg); }
    .card > * { position: relative; z-index: 1; }
    .story-marquee { margin: -26px -22px 18px; overflow: hidden; border-bottom: 3px solid var(--ink); color: #fff; background: var(--carrot); font-size: 12px; font-weight: 800; letter-spacing: .08em; }
    .story-marquee-track { display: flex; width: max-content; padding: 8px 0; }
    .story-marquee-track span { width: max-content; padding-right: 24px; }
    .hero-title, .card h2, .card > p, #result-speech, #result-copy, button { word-break: keep-all; overflow-wrap: break-word; }
    #result-title { white-space: pre-line; }
    .card h2 { max-width: 19rem; margin: 0 0 8px; font-size: 26px; font-weight: 900; line-height: 1.1; letter-spacing: -.04em; }
    .primary { width: 100%; padding: 15px 14px; border: 3px solid var(--ink); border-radius: 12px; color: #fff; background: var(--carrot); box-shadow: 4px 4px 0 var(--ink); font-size: 16px; font-weight: 900; transition: transform 120ms ease, box-shadow 120ms ease; }
    .secondary { width: 100%; padding: 15px 14px; border: 3px solid var(--ink); border-radius: 12px; color: var(--ink); background: #f2dfa7; box-shadow: 3px 3px 0 var(--ink); font-size: 15px; font-weight: 800; transition: transform 120ms ease, box-shadow 120ms ease; }
    .primary:active:not(:disabled), .secondary:active { transform: translateY(3px); box-shadow: 1px 1px 0 var(--ink); }

    .feedback-carousel { display: grid; grid-template-columns: 36px 1fr 36px; align-items: center; margin: 14px 0; border-block: 3px dashed var(--ink); }
    .feedback-carousel button { height: 44px; border: 0; color: var(--ink); background: transparent; font-size: 18px; font-weight: 800; }
    #result-copy { min-height: 54px; margin: 0; padding: 8px; display: grid; place-items: center; color: #52525b; text-align: center; font-size: 14px; font-weight: 700; line-height: 1.4; }
    .result-character { display: grid; grid-template-columns: 112px 1fr; align-items: center; gap: 12px; margin: 14px 0; }
    #result-character-image { width: 112px; height: 112px; object-fit: contain; filter: drop-shadow(2px 3px 0 rgba(0,0,0,0.15)); }
    #result-speech { position: relative; margin: 0; padding: 16px 14px; border: 3px solid var(--ink); border-radius: 16px; background: #fff; box-shadow: 4px 4px 0 var(--ink); font-size: 17px; font-weight: 800; line-height: 1.35; white-space: pre-line; }
    #result-speech::before { position: absolute; top: 43px; left: -12px; width: 18px; height: 18px; border-bottom: 3px solid var(--ink); border-left: 3px solid var(--ink); background: #fff; content: ""; transform: rotate(45deg); }
    #result-list { margin: 14px 0 18px; padding: 0; list-style: none; display: grid; gap: 4px; }
    #result-list li { padding: 11px 13px; border: 3px solid var(--ink); border-radius: 10px; background: #f2dfa7; box-shadow: 3px 3px 0 var(--ink); font-weight: 800; }
    #result-list li:first-child { color: #fff; background: var(--carrot); }
    .actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .actions button { width: 100%; }

    #setup {
      display: block;
      padding: 0;
      overflow-x: hidden;
      overflow-y: auto;
      color: var(--setup-ink);
      background: var(--setup-cream);
    }
    #setup .setup-page {
      position: relative;
      width: 100%;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      padding: max(18px, env(safe-area-inset-top)) 24px max(18px, env(safe-area-inset-bottom));
      overflow: hidden;
      font-family: "Noto Sans KR", Pretendard, system-ui, sans-serif;
      background: var(--setup-cream);
    }
    #setup .setup-page::before,
    #setup .setup-page::after {
      position: absolute;
      z-index: 0;
      width: 58px;
      height: 58px;
      border: 3px solid var(--setup-ink);
      pointer-events: none;
      content: "";
    }
    #setup .setup-page::before { top: 80px; left: -31px; border-radius: 50%; background: #facc15; transform: rotate(24deg); }
    #setup .setup-page::after { right: -25px; bottom: 98px; background: #7dd3fc; transform: rotate(36deg); }
    #setup .setup-page > * { position: relative; z-index: 1; }
    #setup .setup-topbar { position: absolute; inset: 0 0 auto; z-index: 2; height: 10px; background: repeating-linear-gradient(90deg, var(--setup-orange) 0 27px, #facc15 27px 54px, #fb7185 54px 81px, #818cf8 81px 108px); }
    #setup .setup-card,
    #setup #decision-question,
    #setup #setup-submit { border: 3px solid var(--setup-ink); box-shadow: 4px 4px 0 var(--setup-ink); }
    #setup .setup-header { margin: 8px auto 14px; text-align: center; }
    #setup .brand-pill { display: inline-block; padding: 8px 18px; border: 2px solid var(--setup-ink); border-radius: 999px; background: #facc15; box-shadow: 2px 3px 0 var(--setup-ink); font-size: 14px; font-weight: 900; letter-spacing: .08em; transform: rotate(-2deg); }
    #setup #setup-title { margin: 12px 0 10px; font-size: clamp(30px, 8vw, 40px); font-weight: 950; line-height: 1.28; letter-spacing: -.05em; word-break: keep-all; }
    #setup #setup-title em { display: inline-block; font-style: normal; color: var(--setup-orange); transform: translateY(-5px) rotate(-5deg); margin: 0 4px; text-decoration: underline 4px #facc15; text-underline-offset: 6px; }
    #setup #setup-description { margin: 0; color: #52525b; font-size: 13px; font-weight: 650; line-height: 1.5; white-space: nowrap; }
    #setup .question-field { position: relative; margin: 0 0 14px; padding-top: 10px; }
    #setup .question-field label { position: absolute; top: 0; left: 14px; z-index: 1; padding: 2px 8px; color: var(--setup-ink); background: #facc15; font-size: 12px; font-weight: 900; transform: rotate(-2deg); border: 2px solid var(--setup-ink); }
    #setup #decision-question { display: none; width: 100%; padding: 17px 15px 13px; border-radius: 9px; color: var(--setup-ink); background: #fff; font-size: 16px; font-weight: 700; }
    #game[data-mode="choice"] #setup #decision-question { display: block; }
    #setup #decision-question::placeholder { color: #a1a1aa; }
    #setup #name-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; overflow: visible; }
    #game[data-mode="choice"] #setup #name-fields { border: 0; border-radius: 0; background: transparent; box-shadow: none; }
    #setup .participant { position: relative; min-width: 0; display: grid; grid-template-rows: auto 1fr; padding: 0; border-radius: 10px; overflow: hidden; box-shadow: 4px 4px 0 var(--setup-ink); }
    #setup .setup-card--yellow { background: #fde68a; }
    #setup .setup-card--rose { background: #fecdd3; }
    #setup .setup-card--indigo { background: #c7d2fe; }
    #setup .setup-card--sky { background: #bae6fd; }
    #setup #name-fields input,
    #setup #name-fields select { min-width: 0; width: 100%; color: var(--setup-ink); outline: none; }
    #setup #name-fields input { padding: 11px 8px 8px; border: 0; border-bottom: 3px solid var(--setup-ink); background: rgb(255 255 255 / 68%); font-size: 14px; font-weight: 800; text-align: center; }
    #setup #name-fields select { display: none; }
    #setup .mini-character-picker { position: relative; min-height: 132px; display: flex; align-items: center; justify-content: space-between; padding: 4px; background: rgb(255 255 255 / 34%); }
    #setup .mini-character-preview { position: absolute; top: 3px; left: 50%; width: 112px; height: 118px; display: grid; place-items: center; grid-template-rows: 88px 22px; row-gap: 6px; transform: translateX(-50%); font-size: 12px; font-weight: 800; touch-action: pan-y; cursor: grab; }
    #setup .mini-character-preview img { width: 112px; max-width: none; height: 88px; object-fit: contain; filter: drop-shadow(2px 3px 0 rgb(24 24 27 / 24%)); }
    #setup .mini-character-preview span { position: relative; z-index: 2; width: max-content; max-width: 112px; padding: 2px 6px; overflow: visible; border: 2px solid var(--setup-ink); border-radius: 999px; background: #fff; font-size: 11px; line-height: 16px; white-space: nowrap; color: #0f172a; }
    #setup .character-step { position: relative; top: -8px; z-index: 3; width: 44px; height: 44px; padding: 0; border: 0; color: var(--setup-ink); background: transparent; box-shadow: none; font-family: Arial, sans-serif; font-size: 36px; font-weight: 700; line-height: 1; }
    #setup .character-step,
    #setup #setup-submit { transition: transform 120ms ease, box-shadow 120ms ease, background 120ms ease; }
    #setup .character-step:active,
    #setup #setup-submit:active:not(:disabled) { transform: translateY(3px); }
    #setup .mini-character-picker[aria-disabled="true"] { opacity: .35; }
    #setup #name-fields select option:disabled { color: #a1a1aa; }
    #setup #name-fields input:focus { box-shadow: inset 0 -4px 0 var(--setup-orange); }
    #setup .settings { display: flex; justify-content: center; gap: 18px; margin: 8px 0 4px; color: var(--setup-ink); font-size: 14px; font-weight: 800; }
    #setup .settings label { min-height: 44px; display: inline-flex; align-items: center; gap: 7px; cursor: pointer; }
    #setup .settings input { appearance: none; width: 20px; height: 20px; margin: 0; border: 2px solid var(--setup-ink); border-radius: 4px; background: #fff; box-shadow: 2px 2px 0 var(--setup-ink); }
    #setup .settings input:checked { background: var(--setup-orange); box-shadow: 2px 2px 0 var(--setup-ink), inset 0 0 0 4px #fff; }
    #setup .settings select { padding: 4px 8px; border: 2px solid var(--setup-ink); border-radius: 8px; color: var(--setup-ink); background: #fff; font-weight: 800; box-shadow: 2px 2px 0 var(--setup-ink); }
    #setup .setup-footer { margin-top: auto; padding-top: 0; text-align: center; }
    #setup #setup-submit { width: 100%; padding: 15px 12px; border-radius: 9px; color: #fff; background: var(--setup-orange); font-size: 16px; font-weight: 900; }
    #setup #setup-submit:not(:disabled):hover { background: var(--setup-orange-dark); }
    #setup #setup-submit:disabled { color: #71717a; background: #e4e4e7; cursor: not-allowed; }
    #setup :focus-visible { outline: 4px solid rgb(250 204 21 / 45%); outline-offset: 2px; }

    /* Clean High-Contrast Night Mode (밤 테마) */
    html[data-theme="night"] {
      --setup-ink: #f8fafc;
      --setup-cream: #0f172a;
      --ink: #f8fafc;
    }
    html[data-theme="night"], html[data-theme="night"] body { background-color: #090e1a; }
    html[data-theme="night"] #game { background-color: #0f172a; }
    html[data-theme="night"] #setup, html[data-theme="night"] .setup-page {
      background-color: #0f172a;
      color: #f8fafc;
    }
    html[data-theme="night"] #setup #setup-title { color: #f8fafc; }
    html[data-theme="night"] #setup #setup-title em { color: #ff785a; text-decoration: underline 4px #facc15; text-underline-offset: 6px; }
    html[data-theme="night"] #setup #setup-description { color: #94a3b8; }
    html[data-theme="night"] #setup .brand-pill { background: #312e81; color: #a5b4fc; border-color: #818cf8; box-shadow: 2px 3px 0 #000; }
    html[data-theme="night"] #setup .question-field label { color: #fef08a; background: #854d0e; border-color: #facc15; }
    html[data-theme="night"] #setup #decision-question { background: #1e293b; border-color: #475569; color: #f8fafc; box-shadow: 4px 4px 0 #000; }
    html[data-theme="night"] #setup #decision-question::placeholder { color: #64748b; }
    html[data-theme="night"] #setup .participant { background: #1e293b; border-color: #475569; box-shadow: 4px 4px 0 #000; }
    html[data-theme="night"] #setup .setup-card--yellow { background: linear-gradient(180deg, #2d261e 0%, #1e1b18 100%); }
    html[data-theme="night"] #setup .setup-card--rose { background: linear-gradient(180deg, #2e1d24 0%, #1e1519 100%); }
    html[data-theme="night"] #setup .setup-card--indigo { background: linear-gradient(180deg, #1e2338 0%, #151828 100%); }
    html[data-theme="night"] #setup .setup-card--sky { background: linear-gradient(180deg, #192738 0%, #121c28 100%); }
    html[data-theme="night"] #setup #name-fields input { background: rgba(15, 23, 42, 0.8); color: #f8fafc; border-bottom-color: #475569; }
    html[data-theme="night"] #setup #name-fields input::placeholder { color: #64748b; }
    html[data-theme="night"] #setup .mini-character-preview span { background: #0f172a; color: #f8fafc !important; border-color: #475569; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4); }
    html[data-theme="night"] #setup .character-step { color: #cbd5e1; background: rgba(255, 255, 255, 0.1); }
    html[data-theme="night"] #setup .character-step:hover { background: rgba(255, 255, 255, 0.2); color: #ffffff; }
    html[data-theme="night"] #setup .settings { color: #f8fafc; }
    html[data-theme="night"] #setup .settings select { color: #f8fafc; background: #1e293b; border-color: #475569; box-shadow: 2px 2px 0 #000; }
    html[data-theme="night"] #setup .settings input { background: #0f172a; border-color: #475569; box-shadow: 2px 2px 0 #000; }
    html[data-theme="night"] #hud { background: #1e293b; border-color: #475569; color: #f8fafc; box-shadow: 4px 4px 0 #000; }
    html[data-theme="night"] #race-question, html[data-theme="night"] #race-timer { color: #f8fafc; }
    html[data-theme="night"] #status { background: #7e22ce; color: #ffffff; border-color: #a855f7; box-shadow: 2px 2px 0 #000; }
    html[data-theme="night"] #guide { background: #7e22ce; color: #ffffff; border-color: #a855f7; box-shadow: 5px 5px 0 #000; }
    html[data-theme="night"] .primary { background: #7e22ce; color: #ffffff; border-color: #a855f7; box-shadow: 4px 4px 0 #000; }
    html[data-theme="night"] .secondary { background: #1e293b; color: #f8fafc; border-color: #475569; box-shadow: 3px 3px 0 #000; }
    html[data-theme="night"] .secondary:hover { background: #334155; }
    html[data-theme="night"] .player-label { color: #f8fafc; background: #1e293b; border-color: #475569; box-shadow: 2px 2px 0 #000; }
    html[data-theme="night"] .card { background: #1e293b; border-color: #475569; color: #f8fafc; box-shadow: 6px 6px 0 #000; }
    html[data-theme="night"] .card h2 { color: #f8fafc; }
    html[data-theme="night"] #result-speech, html[data-theme="night"] #result-speech::before { background: #0f172a; border-color: #475569; color: #f8fafc; }
    html[data-theme="night"] #result-copy { color: #94a3b8; }
    html[data-theme="night"] .feedback-carousel button { color: #f8fafc; }
    html[data-theme="night"] #result-list li { background: #1e293b; border-color: #475569; color: #f8fafc; box-shadow: 3px 3px 0 #000; }
    html[data-theme="night"] #result-list li:first-child { background: #7e22ce; color: #ffffff; border-color: #a855f7; }


    /* Hamburger Menu Button & Modal */
    .hud-controls { display: flex; align-items: center; gap: 8px; }
    #menu-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      padding: 0;
      border: 1.5px solid rgba(0, 0, 0, 0.1);
      border-radius: 50%;
      color: #0f172a;
      background: rgba(255, 255, 255, 0.85);
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      pointer-events: auto;
      transition: all 0.2s ease;
    }
    #menu-btn:hover { background: #ffffff; transform: scale(1.08); }
    #menu-btn:active { transform: scale(0.92); }
    html[data-theme="night"] #menu-btn { color: #f8fafc; background: rgba(30, 41, 59, 0.85); border-color: rgba(255, 255, 255, 0.2); }

    .menu-card { text-align: center; padding: 32px 24px 28px; }
    .menu-card h2 { font-size: 26px; margin: 0 0 8px; color: #0f172a; }
    .menu-card p { margin: 0 0 24px; color: #64748b; font-size: 15px; font-weight: 600; line-height: 1.5; }
    .menu-actions { display: flex; flex-direction: column; gap: 10px; }

    @media (hover: hover) { button:hover { filter: brightness(1.08); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
  </style>
</head>
<body>
  <main id="game" data-mode="choice" aria-label="데굴이가 골라줘 선택 도우미">
    <div id="hud">
      <span id="race-question">데굴이가 골라줘</span>
      <div class="hud-controls">
        <span id="status">준비</span>
        <button id="menu-btn" type="button" aria-label="메뉴 열기">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
        </button>
      </div>
      <span id="race-timer">00:00.00</span>
    </div>
    <button id="guide" type="button">선택 결과 확인하기</button>
    <div id="race-start" aria-live="assertive" hidden><div class="start-board"><div class="signal-lights" aria-hidden="true"><i></i><i></i><i></i></div><div id="start-count">3</div><div id="start-caption">선택 준비</div></div></div>
    <div id="error">서비스를 불러오지 못했어요.<br />화면을 새로고침해 주세요.</div>
    <section id="setup" class="overlay" aria-labelledby="setup-title">
      <div class="setup-topbar" aria-hidden="true"></div>
      <form id="setup-form" class="setup-page">
        <header class="setup-header">
          <span class="brand-pill">데굴데굴</span>
          <h1 id="setup-title">고민은 <em>가볍게</em><br />데굴이가 골라줘</h1>
          <p id="setup-description">선택지를 적고 캐릭터를 골라주세요.<br />가장 먼저 들어온 데굴이가 하나를 골라줘요.</p>
        </header>
        <section class="question-field" aria-labelledby="question-label">
          <label id="question-label" for="decision-question">Q. 고민은 뭐야?</label>
          <input id="decision-question" maxlength="30" placeholder="무엇을 골라줄까?" required />
        </section>
        <section id="name-fields" aria-label="선택지와 캐릭터">
          <div class="participant setup-card setup-card--yellow">
            <input name="name" maxlength="10" placeholder="1번째 선택지" aria-label="1번째 선택지" required />
            <select name="character" aria-label="첫 번째 캐릭터"></select>
            <div class="mini-character-picker" aria-label="첫 번째 캐릭터 선택">
              <button class="character-step" data-direction="-1" type="button" aria-label="이전 캐릭터">‹</button>
              <div class="mini-character-preview"><img alt="" /><span>곰</span></div>
              <button class="character-step" data-direction="1" type="button" aria-label="다음 캐릭터">›</button>
            </div>
          </div>
          <div class="participant setup-card setup-card--rose">
            <input name="name" maxlength="10" placeholder="2번째 선택지" aria-label="2번째 선택지" required />
            <select name="character" aria-label="두 번째 캐릭터"></select>
            <div class="mini-character-picker" aria-label="두 번째 캐릭터 선택">
              <button class="character-step" data-direction="-1" type="button" aria-label="이전 캐릭터">‹</button>
              <div class="mini-character-preview"><img alt="" /><span>토끼</span></div>
              <button class="character-step" data-direction="1" type="button" aria-label="다음 캐릭터">›</button>
            </div>
          </div>
          <div class="participant setup-card setup-card--indigo">
            <input name="name" maxlength="10" placeholder="3번째 선택지 (선택)" aria-label="3번째 선택지" />
            <select name="character" aria-label="세 번째 캐릭터"></select>
            <div class="mini-character-picker" aria-label="세 번째 캐릭터 선택">
              <button class="character-step" data-direction="-1" type="button" aria-label="이전 캐릭터">‹</button>
              <div class="mini-character-preview"><img alt="" /><span>고양이</span></div>
              <button class="character-step" data-direction="1" type="button" aria-label="다음 캐릭터">›</button>
            </div>
          </div>
          <div class="participant setup-card setup-card--sky">
            <input name="name" maxlength="10" placeholder="4번째 선택지 (선택)" aria-label="4번째 선택지" />
            <select name="character" aria-label="네 번째 캐릭터"></select>
            <div class="mini-character-picker" aria-label="네 번째 캐릭터 선택">
              <button class="character-step" data-direction="-1" type="button" aria-label="이전 캐릭터">‹</button>
              <div class="mini-character-preview"><img alt="" /><span>오리</span></div>
              <button class="character-step" data-direction="1" type="button" aria-label="다음 캐릭터">›</button>
            </div>
          </div>
        </section>
        <div class="settings">
          <label><input id="sound-toggle" type="checkbox" checked /> 소리</label>
          <label><input id="haptic-toggle" type="checkbox" checked /> 진동</label>

          <select id="theme-mode" aria-label="배경 모드">
            <option value="auto" selected>자동 (시간대)</option>
            <option value="day">낮</option>
            <option value="night">밤</option>
          </select>
        </div>
        <footer class="setup-footer">
          <button id="setup-submit" class="primary" type="submit" disabled>데굴이들에게 골라달라고 하기</button>
        </footer>
      </form>
    </section>
    <section id="result" class="overlay" aria-labelledby="result-title" hidden>
      <div class="card">
        <div class="story-marquee" aria-hidden="true"><div class="story-marquee-track"><span>데굴이의 선택</span><span>데굴데굴 하나를 골랐어요</span><span>데굴이의 선택</span><span>데굴데굴 하나를 골랐어요</span></div></div>
        <h2 id="result-title"></h2>
        <div class="result-character">
          <img id="result-character-image" alt="" />
          <p id="result-speech" aria-live="polite"></p>
        </div>
        <div class="feedback-carousel"><button id="comment-prev" type="button" aria-label="이전 한마디">←</button><p id="result-copy" aria-live="polite"></p><button id="comment-next" type="button" aria-label="다음 한마디">→</button></div>
        <ol id="result-list"></ol>
        <div class="actions">
          <button id="edit-players" class="secondary" type="button">선택지 변경</button>
          <button id="replay" class="primary" type="button">다시 골라줘</button>
        </div>
    </section>
    <section id="menu-modal" class="overlay" aria-labelledby="menu-title" hidden>
      <div class="card menu-card">
        <h2 id="menu-title">일시정지</h2>
        <p id="menu-desc">선택 레이스가 진행 중이에요.<br />무엇을 할까요?</p>
        <div class="actions menu-actions">
          <button id="menu-resume" class="primary" type="button">계속하기</button>
          <button id="menu-quit" class="secondary" type="button">그만하기 (처음으로)</button>
        </div>
      </div>
    </section>
  </main>
  <script type="module" src="./game.ts"></script>
</body>
</html>
